name: Deploy to Coolify

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: amplixy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for GitHub repository propagation
        run: sleep 10

      - name: Trigger Coolify deployment
        env:
          COOLIFY_WEBHOOK_SECRET: ${{ secrets.COOLIFY_WEBHOOK_SECRET }}
        run: |
          signature="$(openssl dgst -sha256 -hmac "$COOLIFY_WEBHOOK_SECRET" "$GITHUB_EVENT_PATH" | awk '{print $2}')"
          curl --fail-with-body --silent --show-error \
            --retry 3 \
            --request POST \
            --header "Content-Type: application/json" \
            --header "User-Agent: GitHub-Actions" \
            --header "X-GitHub-Event: push" \
            --header "X-GitHub-Delivery: ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --header "X-Hub-Signature-256: sha256=${signature}" \
            --data-binary "@${GITHUB_EVENT_PATH}" \
            "https://panel.amplixy.cloud/webhooks/source/github/events/manual"
